name: Hydra macOS experimental build

on:
  push:
    branches: [hydra-macos-ci-experiment]
    paths-ignore:
      - "hydra-macos-ci/community-ports-index.json"
      - "hydra-macos-ci/README*.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hydra-macos-${{ github.ref }}
  cancel-in-progress: true

jobs:
  hydra-arm64:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
      HYDRA_TORRENT_BRIDGE_FROM_SOURCE: "1"
      CARGO_PROFILE_RELEASE_STRIP: "none"
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      MAIN_VITE_API_URL: ${{ vars.MAIN_VITE_API_URL || 'https://hydra-api-us-east-1.losbroxas.org' }}
      MAIN_VITE_AUTH_URL: ${{ vars.MAIN_VITE_AUTH_URL || 'https://auth.hydra.losbroxas.org' }}
      MAIN_VITE_CHECKOUT_URL: ${{ vars.MAIN_VITE_CHECKOUT_URL || 'https://checkout.hydralauncher.gg' }}
      MAIN_VITE_NIMBUS_API_URL: ${{ vars.MAIN_VITE_NIMBUS_API_URL || 'https://api.hydranimbus.com' }}
      RENDERER_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL || 'https://assets.hydralauncher.gg' }}
      MAIN_VITE_EXTERNAL_RESOURCES_URL: ${{ vars.EXTERNAL_RESOURCES_URL || 'https://assets.hydralauncher.gg' }}
    steps:
      - name: Checkout builder branch
        uses: actions/checkout@v4
      - name: Clone the upstream Hydra source
        run: git clone --depth 1 https://github.com/hydralauncher/hydra.git hydra
      - name: Install experimental macOS integration before building
        run: python3 hydra-macos-ci/apply.py hydra
      - name: Validate Console Ports integration
        run: |
          set -euo pipefail
          grep -F 'Console Ports' hydra/src/renderer/src/components/sidebar/sidebar.tsx
          grep -F '/community-ports' hydra/src/renderer/src/components/sidebar/routes.tsx
          grep -F 'fetchConsolePortsRss' hydra/src/preload/index.ts
          test -s hydra/src/main/events/console-ports-rss.ts
          test -s hydra/src/renderer/src/pages/community-ports/community-ports.tsx
      - name: Ensure native Apple Silicon
        run: |
          test "$(uname -s)" = Darwin
          test "$(uname -m)" = arm64
          sw_vers
          xcodebuild -version
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22.21.0
      - name: Install Yarn Classic
        run: |
          npm install -g yarn@1.22.22
          yarn --version
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Install native source compilation tools
        run: brew install cmake ninja pkg-config autoconf automake libtool
      - name: Confirm Hydra service endpoints for catalogue and sources
        shell: bash
        run: |
          set -euo pipefail
          for key in MAIN_VITE_API_URL MAIN_VITE_AUTH_URL RENDERER_VITE_EXTERNAL_RESOURCES_URL; do
            value="${!key}"
            test -n "$value" || { echo "::error::$key is empty"; exit 1; }
            case "$value" in https://*) ;; *) echo "::error::$key must be HTTPS"; exit 1 ;; esac
          done
          echo "Configured the public Hydra API, auth service and external resources."
          # Verify the downloadable renderer resources are reachable; the
          # service may return 403/404 from a CI IP, so warn rather than block.
          response=$(curl --location --silent --show-error --max-time 25 --output /dev/null --write-out '%{http_code}' "$RENDERER_VITE_EXTERNAL_RESOURCES_URL/bundle.js" || true)
          echo "External renderer bundle HTTP status: $response"
      - name: Build and validate the Rust/libtorrent native addon
        working-directory: hydra
        shell: bash
        run: |
          set -o pipefail
          yarn --frozen-lockfile 2>&1 | tee ../hydra-build.log
      - name: Check Mach-O LINKEDIT alignment
        working-directory: hydra
        shell: bash
        run: |
          set -euo pipefail
          otool -l hydra-native/hydra-native.node | awk '
            /cmd LC_SYMTAB/ { sym=1; next }
            sym && /stroff/ { offset=$2; print "Mach-O string table offset:",offset;
              if (offset % 8) { print "LINKEDIT MISALIGNED"; exit 1 }
              print "LINKEDIT aligned"; exit 0
            }'
      - name: Validate TypeScript
        working-directory: hydra
        shell: bash
        run: |
          set -o pipefail
          yarn typecheck 2>&1 | tee -a ../hydra-build.log
      - name: Package unsigned Apple Silicon DMG
        working-directory: hydra
        shell: bash
        env:
          NODE_OPTIONS: "--max-old-space-size=4096"
        run: |
          set -o pipefail
          echo "Vite renderer: Node heap limit 4096 MB"
          node -e 'console.log("Node heap limit (MB):", Math.round(require("node:v8").getHeapStatistics().heap_size_limit / 1024 / 1024))'
          ./node_modules/.bin/electron-vite build 2>&1 | tee -a ../hydra-build.log
          ./node_modules/.bin/electron-builder --mac --arm64 --publish never 2>&1 | tee -a ../hydra-build.log
      - name: Upload DMG, app archive and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Hydra-macOS-Console-Ports-${{ github.run_number }}
          retention-days: 7
          if-no-files-found: warn
          path: |
            hydra/dist/*.dmg
            hydra/dist/*.zip
            hydra/dist/*.yml
            hydra-build.log
