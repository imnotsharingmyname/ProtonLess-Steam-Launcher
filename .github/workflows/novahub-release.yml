name: NovaHub macOS bundled-engine application
on:
  push:
    branches:
      - build/novahub-mac-v0-1
    paths:
      - "NovaHubMac/**"
      - ".github/workflows/novahub-release.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS application
        shell: bash
        run: |
          set -euo pipefail
          APP="$PWD/dist/NovaHub.app"
          mkdir -p "$APP/Contents/MacOS"
          SDK="$(xcrun --sdk macosx --show-sdk-path)"
          for ARCH in x86_64 arm64; do
            xcrun swiftc -parse-as-library -O \
              -target "$ARCH-apple-macosx13.0" \
              -sdk "$SDK" \
              -framework SwiftUI -framework AppKit -framework Metal \
              NovaHubMac/App.swift -o "/tmp/NovaHub-$ARCH"
          done
          lipo -create /tmp/NovaHub-x86_64 /tmp/NovaHub-arm64 \
            -output "$APP/Contents/MacOS/NovaHub"
          cat > "$APP/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN"
            "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0"><dict>
            <key>CFBundleExecutable</key><string>NovaHub</string>
            <key>CFBundleIdentifier</key><string>dev.novahub.mac</string>
            <key>CFBundleName</key><string>NovaHub</string>
            <key>CFBundleDisplayName</key><string>NovaHub</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.2.0</string>
            <key>CFBundleVersion</key><string>2</string>
            <key>LSMinimumSystemVersion</key><string>13.0</string>
            <key>NSHighResolutionCapable</key><true/>
          </dict></plist>
          PLIST
          # Bundle the macOS-native Intel Wine engine inside NovaHub.app.
          # Pinned upstream release from https://github.com/Gcenx/macOS_Wine_builds
          WINE_URL="https://github.com/Gcenx/macOS_Wine_builds/releases/download/11.21/wine-staging-11.21-osx64.tar.xz"
          WINE_SHA256="d7bcd5abf4df27aae397a7898aef074fea4a2e0b51e0a55aa9659517bbf9d452"
          curl --fail --location --retry 3 --output /tmp/novahub-wine.tar.xz "$WINE_URL"
          echo "$WINE_SHA256  /tmp/novahub-wine.tar.xz" | shasum -a 256 -c -
          RES="$APP/Contents/Resources"
          mkdir -p "$RES/WineRuntime"
          tar -xJf /tmp/novahub-wine.tar.xz -C "$RES/WineRuntime"
          echo "Extracted Wine runtime directory:"
          find "$RES/WineRuntime" -maxdepth 5 -type d | head -35 || true
          WINE_BIN="$(find -L "$RES/WineRuntime" -type f -name wine -print -quit)"
          if [ -z "$WINE_BIN" ]; then
            echo "Wine executable not found in the upstream archive."
            exit 1
          fi
          chmod +x "$WINE_BIN"
          echo "Wine binary: $WINE_BIN"
          "$WINE_BIN" --version
          echo "Wine executable relative to bundled root:"
          printf '%s\n' "\${WINE_BIN#"$RES/WineRuntime/"}" > "$RES/wine-bin.txt"
          cat > "$RES/ENGINE-LICENSES.txt" <<'NOTICE'
          NovaHub embeds an unmodified Wine Staging 11.21 macOS runtime from Gcenx.
          Source and license information: https://github.com/wine-mirror/wine
          Package source and redistributor: https://github.com/Gcenx/macOS_Wine_builds/releases/tag/11.21
          Wine is free software distributed under the GNU LGPL (version 2.1 or later).
          Third-party runtime components retain their respective licenses.
          NOTICE
          # Ad-hoc signing for development. No Apple notarisation is supplied.
          /usr/bin/codesign --force --deep --sign - --timestamp=none "$APP"
          /usr/bin/codesign --verify --verbose "$APP"
          file "$APP/Contents/MacOS/NovaHub"
          /usr/bin/ditto -c -k --keepParent "$APP" "$PWD/dist/NovaHubMac-v0.2-integrated.zip"
      - name: Upload .app bundle
        uses: actions/upload-artifact@v4
        with:
          name: NovaHubMac-v0.1-universal
          path: dist/NovaHubMac-v0.1-universal.zip
          if-no-files-found: error
          retention-days: 30
