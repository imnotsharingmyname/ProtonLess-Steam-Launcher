name: Release ProtonLess Steam

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  build:
    # Reuse exactly the same verified app bundle and ZIP as a manual Actions build.
    uses: ./.github/workflows/app.yml

  release:
    name: Publish ProtonLess Steam ZIP
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: ProtonLess-Steam-macOS-Apple-Silicon
          path: release

      - name: Verify version and ZIP artifact
        shell: bash
        run: |
          set -euo pipefail
          version=$(sed -n 's/^#define NOTPROTON_VERSION "\(.*\)"/\1/p' dylib/version.h)
          test -n "$version"
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match app version v${version}" >&2
            exit 1
          fi
          test -s release/ProtonLess-Steam.zip
          unzip -t release/ProtonLess-Steam.zip >/dev/null

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/ProtonLess-Steam.zip \
            --verify-tag \
            --title "ProtonLess Steam ${GITHUB_REF_NAME}" \
            --generate-notes
